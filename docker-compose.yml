services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: q-zap-evolution-api
    restart: always
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - SERVER_URL=${EVOLUTION_API_URL:-http://localhost:8080}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - q-zap-net

  postgres:
    image: postgres:15
    container_name: q-zap-postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - q-zap-net

volumes:
  evolution_instances:
  postgres_data:

networks:
  q-zap-net:
    driver: bridge
